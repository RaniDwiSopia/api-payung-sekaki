<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>⚡ Dashboard Test Balai</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; background: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #ddd; }
        button { cursor: pointer; font-weight: bold; color: white; border: none; }
        .btn-blue { background: #007bff; } .btn-blue:hover { background: #0056b3; }
        .btn-green { background: #28a745; } .btn-green:hover { background: #218838; }
        .btn-orange { background: #ffc107; color: #333; }
        .result-box { margin-top: 10px; padding: 10px; border-radius: 5px; font-size: 14px; background: #eee; }
        .item-list { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
        .item-card { min-width: 200px; border: 1px solid #ddd; padding: 10px; border-radius: 8px; background: #fff; }
        img.preview { width: 100%; height: 100px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>⚡ Test Backend: Fitur Balai</h1>

    <div class="card">
        <h2>1. 🔐 Login Admin</h2>
        <input type="email" id="email" placeholder="Email Admin" value="admin@gmail.com">
        <input type="password" id="password" placeholder="Password">
        <button class="btn-blue" onclick="login()">Masuk & Ambil Token</button>
        <div id="statusLogin" class="result-box">Belum Login...</div>
    </div>

    <div class="card">
        <h2>2. 🖼️ Upload Banner (Slider)</h2>
        <input type="text" id="bannerTitle" placeholder="Judul Banner Besar">
        <input type="text" id="bannerSub" placeholder="Subtitle Kecil">
        <input type="file" id="bannerFile">
        <button class="btn-orange" onclick="uploadBanner()">Upload Banner</button>
        <div id="statusBanner" class="result-box">Status...</div>
        
        <h3>Daftar Banner di Database:</h3>
        <button onclick="loadBanners()" style="width:auto; background:#666;">🔄 Refresh List</button>
        <div id="listBanner" class="item-list"></div>
    </div>

    <div class="card">
        <h2>3. 📂 Upload Dokumen (PDF/SK)</h2>
        <input type="text" id="docTitle" placeholder="Nama Dokumen (misal: Juknis 2024)">
        <select id="docCat">
            <option value="Regulasi">Regulasi / SK</option>
            <option value="Materi">Materi Diklat</option>
            <option value="Umum">Umum</option>
        </select>
        <input type="file" id="docFile">
        <button class="btn-green" onclick="uploadDoc()">Upload Dokumen</button>
        <div id="statusDoc" class="result-box">Status...</div>

        <h3>Arsip Dokumen di Database:</h3>
        <button onclick="loadDocs()" style="width:auto; background:#666;">🔄 Refresh List</button>
        <div id="listDoc" class="result-box" style="background: white;"></div>
    </div>

    <script>
        let token = localStorage.getItem('token_balai'); 
        const API_URL = "http://localhost:3001"; // Ganti port kalau beda

        // Cek login awal
        if(token) document.getElementById('statusLogin').innerHTML = "<b>Sudah Login!</b> Token tersimpan.";

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    token = data.token;
                    localStorage.setItem('token_balai', token);
                    document.getElementById('statusLogin').innerHTML = "✅ <b>Login Sukses!</b>";
                    document.getElementById('statusLogin').style.backgroundColor = "#d4edda";
                    loadBanners(); // Langsung muat data
                    loadDocs();
                } else {
                    alert(data.pesan);
                }
            } catch (err) { alert("Error: " + err.message); }
        }

        // --- FUNGSI BANNER ---
        async function uploadBanner() {
            if (!token) return alert("Login dulu bang!");
            const formData = new FormData();
            formData.append('title', document.getElementById('bannerTitle').value);
            formData.append('subtitle', document.getElementById('bannerSub').value);
            formData.append('gambar', document.getElementById('bannerFile').files[0]); // Sesuai server.js

            const statusDiv = document.getElementById('statusBanner');
            statusDiv.innerHTML = "⏳ Mengupload...";

            try {
                const res = await fetch(`${API_URL}/banners`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData
                });
                const data = await res.json();
                if(res.ok) {
                    statusDiv.innerHTML = "✅ " + data.pesan;
                    loadBanners(); // Refresh list otomatis
                } else {
                    statusDiv.innerHTML = "❌ " + (data.pesan || data.error);
                }
            } catch (err) { statusDiv.innerHTML = "❌ Error: " + err.message; }
        }

        async function loadBanners() {
            const res = await fetch(`${API_URL}/banners`);
            const data = await res.json();
            const container = document.getElementById('listBanner');
            container.innerHTML = data.map(item => `
                <div class="item-card">
                    <img src="${item.image_url}" class="preview">
                    <b>${item.title}</b><br>
                    <small>${item.subtitle || '-'}</small>
                </div>
            `).join('');
        }

        // --- FUNGSI DOKUMEN ---
        async function uploadDoc() {
            if (!token) return alert("Login dulu bang!");
            const formData = new FormData();
            formData.append('title', document.getElementById('docTitle').value);
            formData.append('category', document.getElementById('docCat').value);
            formData.append('dokumen', document.getElementById('docFile').files[0]); // Sesuai server.js

            const statusDiv = document.getElementById('statusDoc');
            statusDiv.innerHTML = "⏳ Mengupload PDF...";

            try {
                const res = await fetch(`${API_URL}/downloads`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData
                });
                const data = await res.json();
                if(res.ok) {
                    statusDiv.innerHTML = "✅ " + data.pesan;
                    loadDocs(); // Refresh list otomatis
                } else {
                    statusDiv.innerHTML = "❌ " + (data.pesan || data.error);
                }
            } catch (err) { statusDiv.innerHTML = "❌ Error: " + err.message; }
        }

        async function loadDocs() {
            const res = await fetch(`${API_URL}/downloads`);
            const data = await res.json();
            const container = document.getElementById('listDoc');
            container.innerHTML = data.map(item => `
                <div style="border-bottom:1px solid #eee; padding:5px;">
                    📂 <b>${item.title}</b> <span style="background:#ddd; padding:2px 5px; font-size:10px; border-radius:3px;">${item.category}</span>
                    <a href="${item.file_url}" target="_blank" style="float:right; text-decoration:none;">⬇️ Download</a>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
