<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Upload Backend</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
        .box { border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #status { margin-top: 10px; padding: 10px; background: #f0f0f0; }
        img { max-width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>🛠️ Tes Backend Payung Sekaki</h2>

    <div class="box">
        <h3>1. Login (Dapat Token)</h3>
        <input type="email" id="email" placeholder="Email Admin (di Supabase Auth)">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Masuk</button>
    </div>

    <div class="box">
        <h3>2. Upload Berita + Foto</h3>
        <input type="text" id="judul" placeholder="Judul Berita">
        <textarea id="konten" placeholder="Isi Berita..."></textarea>
        <input type="file" id="gambar">
        <button onclick="uploadBerita()">Upload Berita</button>
    </div>

    <div id="status">Status: Belum ada aksi...</div>

    <script>
        let token = '';

        // Fungsi Login
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('status');

            statusDiv.innerHTML = "⏳ Sedang login...";

            try {
                const res = await fetch('http://localhost:3001/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    token = data.token;
                    statusDiv.innerHTML = "✅ <b>Login Sukses!</b> Token tersimpan.";
                    statusDiv.style.backgroundColor = "#d4edda";
                } else {
                    statusDiv.innerHTML = "❌ Gagal: " + data.pesan;
                    statusDiv.style.backgroundColor = "#f8d7da";
                }
            } catch (err) {
                statusDiv.innerHTML = "❌ Error: " + err.message;
            }
        }

        // Fungsi Upload
        async function uploadBerita() {
            if (!token) {
                alert("Login dulu bang!");
                return;
            }

            const judul = document.getElementById('judul').value;
            const konten = document.getElementById('konten').value;
            const fileInput = document.getElementById('gambar');
            const statusDiv = document.getElementById('status');

            if(fileInput.files.length === 0) {
                alert("Pilih gambar dulu!");
                return;
            }

            // Siapkan Form Data (Karena ada file gambar)
            const formData = new FormData();
            formData.append('title', judul);
            formData.append('content', konten);
            formData.append('gambar', fileInput.files[0]);

            statusDiv.innerHTML = "⏳ Sedang mengupload ke Supabase...";

            try {
                const res = await fetch('http://localhost:3001/news', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token // Token Satpam
                    },
                    body: formData
                });

                const data = await res.json();

            if (res.ok) {
                // Ambil link gambar langsung dari database (lebih aman)
                const linkGambar = data.data[0].cover_image; 
                statusDiv.innerHTML = `
                <b>Upload Berhasil!</b><br>
                Judul: ${data.data[0].title}<br>
                <a href="${linkGambar}" target="_blank">Lihat Gambar di Supabase</a><br>
                <img src="${linkGambar}" alt="Preview" style="max-width: 300px; margin-top: 10px; border-radius: 8px;">`                       ;
                statusDiv.style.backgroundColor = "#d4edda";
            } else {
                statusDiv.innerHTML = "❌ Gagal Upload: " + (data.pesan || data.error);
                statusDiv.style.backgroundColor = "#f8d7da";
                }
            } catch (err) {
                statusDiv.innerHTML = "❌ Error Server: " + err.message;
            }
        }
    </script>
</body>
</html>
